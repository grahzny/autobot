[project]
name = "autobot"
version = "0.3.0"
description = "Autobot -- Market Trading Entity"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "websockets>=12.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "yfinance>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
autobot = "autobot.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
