<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autobot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Connect screen -->
  <div id="connect-screen" class="screen">
    <div class="connect-box">
      <h1>Autobot</h1>
      <p class="subtitle">A living entity</p>
      <input type="text" id="name-input" placeholder="Enter your name" autocomplete="off">
      <button id="connect-btn">Connect</button>
    </div>
  </div>

  <!-- Chat screen -->
  <div id="chat-screen" class="screen hidden">
    <div class="layout">

      <!-- Left: Entity's Mind -->
      <aside id="mind-panel" class="panel">
        <h2>Entity's Mind</h2>

        <div class="mind-card">
          <label>Mood</label>
          <span id="mood-val" class="mood-badge">--</span>
        </div>

        <div class="mind-card">
          <label>Energy</label>
          <div class="energy-row">
            <div class="bar-wrap"><div id="energy-bar" class="bar" style="width:100%"></div></div>
            <span id="energy-pct" class="energy-pct">100%</span>
          </div>
        </div>

        <div class="mind-card">
          <label>Emotions</label>
          <div id="emotions-detail" class="emotions-detail">--</div>
        </div>

        <div class="mind-card mind-card-thinking">
          <label>Thinking</label>
          <div id="thinking-box" class="thinking-box">--</div>
        </div>

        <div class="mind-card">
          <label>Goals</label>
          <ul id="goals-list" class="goal-list"><li class="dim">--</li></ul>
        </div>

        <div class="mind-card">
          <label>Memories</label>
          <ul id="memories-list" class="memory-list"><li class="dim">--</li></ul>
        </div>

        <button id="toggle-debug" class="small-btn">Show Debug</button>
        <div id="debug-panel" class="debug-panel hidden">
          <pre id="debug-json">{}</pre>
        </div>
      </aside>

      <!-- Center: Chat -->
      <main class="chat-panel">
        <div class="chat-header">
          <span id="entity-name">Autobot</span>
          <span id="entity-mood-hint" class="mood-hint"></span>
        </div>
        <div id="messages" class="messages"></div>
        <div class="input-area">
          <input type="text" id="msg-input" placeholder="Say something..." autocomplete="off">
          <button id="send-btn">Send</button>
        </div>
      </main>

    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
